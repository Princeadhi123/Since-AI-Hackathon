[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-librarian"
version = "0.1.0"
description = "Governed analytics assistant over curated data catalogs"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
ui = [
    "streamlit>=1.40,<2",
]
llm = [
    "openai>=1.68,<3",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["src/**/*.py", "apps/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
