[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-librarian"
version = "0.1.0"
description = "Governed analytics assistant over curated data catalogs"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40,<2",
    "plotly>=6,<7",
    "pandas>=2.2,<3",
]
llm = [
    "openai>=1.68,<3",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smart_librarian = ["llm/intent_prompt.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["src/**/*.py", "apps/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
